name: Bug report
description: Something does not work as described in the documentation.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Never paste the password of your Bright account.
  - type: input
    id: gladys-version
    attributes:
      label: Gladys version
      description: Settings → System.
      placeholder: '5.3.0'
    validations:
      required: true
  - type: input
    id: integration-version
    attributes:
      label: Integration version
      description: Integrations → Hildebrand Glow (DCC), or Settings → Supervision.
      placeholder: '0.1.0'
    validations:
      required: true
  - type: input
    id: devices
    attributes:
      label: Meters
      description: Electricity and / or gas, SMETS1 or SMETS2, with or without a Glow display (IHD / CAD), and your energy supplier.
      placeholder: 'SMETS2 electricity + gas, no Glow display, Octopus Energy'
  - type: textarea
    id: test-connection
    attributes:
      label: Result of "Test the connection"
      description: The text shown under the "Test the connection" button of the configuration (meters, data up to, features).
      render: text
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
      description: 'Remember that the smart meter data reach Hildebrand through the DCC 30 minutes to a few hours late: compare with what the Bright app shows at the same time.'
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Logs of the integration (Settings → Supervision). In developer mode, add the environment variable `DEBUG=gladys-integration-sdk` for the SDK debug logs, reproduce, then copy the lines. The logs never contain the password nor the token.
      render: text
