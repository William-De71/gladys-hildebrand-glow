<svg xmlns="http://www.w3.org/2000/svg" width="800" height="534" viewBox="0 0 800 534">
  <!-- Cover of the Hildebrand Glow (DCC) integration for Gladys Assistant
       (illustration, no Hildebrand logo): a British terraced house, its smart
       electricity and gas meters, the half-hours climbing to the cloud, and
       the meter card of Gladys. Built into cover.jpg by scripts/build-cover.sh. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef3f8"/>
      <stop offset="1" stop-color="#e6edf5"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f7fb"/>
    </linearGradient>
    <linearGradient id="brick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8644a"/>
      <stop offset="1" stop-color="#a1543d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="534" fill="url(#bg)"/>
  <!-- ground -->
  <rect y="470" width="800" height="64" fill="#cfd8c4"/>

  <!-- terraced house -->
  <g transform="translate(40 150)">
    <path d="M0 110 L150 20 L300 110 Z" fill="#4c5866"/>
    <rect x="210" y="34" width="28" height="56" fill="#7a5a4a"/>
    <rect x="16" y="110" width="268" height="210" fill="url(#brick)"/>
    <g stroke="#9a4f39" stroke-width="2" opacity="0.6">
      <path d="M16 150 H284 M16 190 H284 M16 230 H284 M16 270 H284 M16 310 H284"/>
    </g>
    <!-- windows -->
    <g fill="#dbe8f3" stroke="#ffffff" stroke-width="6">
      <rect x="40" y="132" width="76" height="62"/>
      <rect x="184" y="132" width="76" height="62"/>
      <rect x="184" y="226" width="76" height="70"/>
    </g>
    <!-- door -->
    <rect x="52" y="226" width="56" height="94" rx="4" fill="#1f4f7a"/>
    <circle cx="96" cy="276" r="4" fill="#e5c06b"/>
    <rect x="44" y="214" width="72" height="10" fill="#f4f4f4"/>
  </g>

  <!-- the two smart meters -->
  <g transform="translate(372 300)">
    <rect width="96" height="128" rx="12" fill="#ffffff" stroke="#c6ced8" stroke-width="3"/>
    <rect x="14" y="16" width="68" height="34" rx="5" fill="#1f2d3d"/>
    <text x="48" y="40" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#7fd1ff">0.42</text>
    <path d="M40 66 l 14 0 l -10 18 l 14 0 l -22 26 l 6 -18 l -12 0 Z" fill="#f2b233"/>
    <text x="48" y="124" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#6b7785">kWh</text>
  </g>
  <g transform="translate(486 316)">
    <rect width="88" height="112" rx="12" fill="#ffffff" stroke="#c6ced8" stroke-width="3"/>
    <rect x="12" y="14" width="64" height="30" rx="5" fill="#1f2d3d"/>
    <text x="44" y="35" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffb15c">1.37</text>
    <path d="M44 58 c 10 12 14 20 6 32 c -4 6 -16 6 -20 0 c -6 -10 2 -16 4 -24 c 4 6 6 8 10 -8 Z" fill="#3c8de0"/>
  </g>

  <!-- half-hours climbing to the cloud -->
  <g fill="#2f6fb5">
    <rect x="384" y="250" width="12" height="22" rx="3" opacity="0.45"/>
    <rect x="402" y="236" width="12" height="36" rx="3" opacity="0.55"/>
    <rect x="420" y="220" width="12" height="52" rx="3" opacity="0.65"/>
    <rect x="438" y="196" width="12" height="76" rx="3" opacity="0.75"/>
    <rect x="456" y="210" width="12" height="62" rx="3" opacity="0.85"/>
    <rect x="474" y="184" width="12" height="88" rx="3"/>
  </g>
  <!-- cloud -->
  <g transform="translate(372 64)" fill="#ffffff" stroke="#c9d6e4" stroke-width="3">
    <path d="M40 92 a 34 34 0 0 1 8 -66 a 44 44 0 0 1 82 -8 a 36 36 0 0 1 52 30 a 26 26 0 0 1 -6 44 Z"/>
  </g>
  <text x="458" y="132" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#2f6fb5">DCC</text>

  <!-- the meter card of Gladys -->
  <g transform="translate(590 96)">
    <rect width="182" height="236" rx="20" fill="url(#card)" stroke="#d6dde6" stroke-width="2"/>
    <path d="M28 34 l 10 0 l -7 13 l 10 0 l -16 19 l 4 -13 l -9 0 Z" fill="#2f6fb5"/>
    <text x="52" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#344050">Today</text>
    <text x="24" y="98" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#2f6fb5">11.8</text>
    <text x="104" y="98" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#6b7785">kWh</text>
    <text x="24" y="130" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#344050">£2.90</text>
    <g fill="#2f6fb5">
      <rect x="24" y="196" width="10" height="16" rx="2"/>
      <rect x="38" y="186" width="10" height="26" rx="2"/>
      <rect x="52" y="174" width="10" height="38" rx="2"/>
      <rect x="66" y="190" width="10" height="22" rx="2"/>
      <rect x="80" y="166" width="10" height="46" rx="2"/>
      <rect x="94" y="180" width="10" height="32" rx="2"/>
      <rect x="108" y="160" width="10" height="52" rx="2"/>
      <rect x="122" y="172" width="10" height="40" rx="2"/>
      <rect x="136" y="186" width="10" height="26" rx="2"/>
    </g>
  </g>

  <!-- title -->
  <text x="40" y="70" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2d3d">Hildebrand Glow</text>
  <text x="40" y="104" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#4c5866">UK smart meters in Gladys</text>
</svg>
